name: Release

# Publica un instalador cada vez que se empuja un tag v*.
# El tag es la unica fuente de verdad: si no coincide con la version de
# package.json, el workflow falla y no publica nada.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag a publicar, por ejemplo v0.3.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Verificar que el tag coincide con la version
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::el tag $TAG no coincide con la version $VERSION de package.json"
            exit 1
          fi
          echo "Publicando $TAG (package.json $VERSION)"

      - name: Lint
        run: npm run lint -- --quiet

      - name: Tests
        run: npm test

      - name: Compilar instalador
        run: npm run dist

      - name: Publicar release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          # electron-builder deja tambien el __uninstaller.exe en release/,
          # asi que se toma el .exe mas reciente que no sea ese
          ASSET=$(ls -t release/*.exe | grep -vi uninstaller | head -n 1)
          if [ -z "$ASSET" ]; then
            echo "::error::no se encontro ningun instalador en release/"
            ls -la release/ || true
            exit 1
          fi
          echo "Adjuntando $ASSET"
          gh release create "$TAG" "$ASSET" \
            --verify-tag \
            --generate-notes \
            --title "$TAG"
